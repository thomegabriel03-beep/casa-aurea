name: Ligar as peças do site ao banco
on:
  workflow_dispatch:
    inputs:
      modo:
        description: "teste = só mostra o plano; ligar = grava no banco"
        required: true
        default: "teste"
        type: choice
        options: [teste, ligar]
jobs:
  ligar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Dependências
        run: pip install -r worker/requirements.txt
      - name: Ligar a seleção de lançamento às peças do banco
        working-directory: worker
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ "${{ inputs.modo }}" = "ligar" ]; then
            python -m casa_aurea_import.link_launch --site ../public/site
          else
            python -m casa_aurea_import.link_launch --site ../public/site --dry-run
          fi
